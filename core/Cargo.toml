[package]
name = "aiwm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "AI Workstation Manager — core logic (orchestration, scheduling, model registry, telemetry)."
publish = false

[lints]
workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
toml.workspace = true
uuid.workspace = true
time.workspace = true
dirs.workspace = true
sqlx.workspace = true
nvml-wrapper.workspace = true
sysinfo.workspace = true
async-trait.workspace = true
axum.workspace = true
futures-util.workspace = true
sha2.workspace = true
base64.workspace = true
reqwest.workspace = true
zip.workspace = true
# ComfyUI's own `/ws` progress stream (`runtime::comfyui` -> `progress`), plus
# the loopback `/ws` telemetry + job-progress routes' tests below.
tokio-tungstenite = "0.30"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "webp", "rayon"] }
imageproc = "0.25.1"
image_hasher = "3.0.0"
walkdir = "2.5.0"

[target.'cfg(windows)'.dependencies]
win32job = "2"
junction.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
