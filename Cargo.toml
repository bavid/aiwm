[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "LicenseRef-Proprietary"   # private project, non-commercial (ADR-011)
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "signal", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
toml = "0.8"
uuid = { version = "1", features = ["v7"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
dirs = "7"
tempfile = "3"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "time", "uuid"] }
nvml-wrapper = "0.13"
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
sha2 = "0.11"
# HTTP client: loopback for managed runtimes (ADR-008), HTTPS for the llama.cpp
# release download (ADR-014). `native-tls` = Schannel on our Windows target — no
# OpenSSL, no bundled CA roots, uses the OS trust store. `json` for the API tests.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls", "http2"] }
# Extracting downloaded runtime archives (llama.cpp CUDA build). `deflate` only —
# no aes/bzip2/zstd/lzma; the flate2 zlib-rs backend keeps it pure-Rust.
zip = { version = "8", default-features = false, features = ["deflate"] }
# NTFS directory junctions for the model link manager (ADR-007). Safe API over
# the reparse-point IOCTL — no admin, no hand-written unsafe.
junction = "2"

[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
# MSVC prints an import-library creation note to stdout when linking the Tauri
# cdylib; it is not actionable.
linker_messages = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
todo = "allow"          # scaffolding phase; tighten to "warn" after WP-5
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
opt-level = 1           # keeps NVML/telemetry loop responsive during `tauri dev`

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
