# Pinned Rust toolchain for the whole workspace.
# After installing rustup, run `rustc --version` and replace "stable" with the
# exact version (e.g. "1.86.0") to make CI fully reproducible.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = ["x86_64-pc-windows-msvc"]
profile = "default"
