[project]
name = "aiwm-sidecar"
version = "0.0.1"
description = "AI Workstation Manager — Python sidecar (model-file inspection, HF Hub, agent runners)."
requires-python = ">=3.11"
dependencies = []
# Real deps land later: huggingface_hub (Phase 6), gguf/safetensors readers (Phase 2).

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[tool.uv]
# uv cache (C:) and project (E:) are on different volumes -> hardlinking fails.
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiwm_sidecar"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
